<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum de Figuritas CRBV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0F8;
    --paper-2:#DCE2F2;
    --slot-empty:#CBD4EA;
    --ink:#1B2657;
    --ink-soft:#4A5480;
    --stamp:#243A8E;
    --stamp-dark:#182667;
    --gold:#F7C600;
    --gold-dark:#C79A00;
    --sage:#243A8E;
    --line:#A9B4D6;
    --white:#F8F9FD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,43,61,0.06) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.03em;
    font-weight:400;
  }
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--white);
    border:2px solid var(--ink);
    border-radius:4px;
    box-shadow:6px 6px 0 var(--ink);
    padding:40px 36px;
    max-width:380px;
    width:100%;
    text-align:center;
    position:relative;
  }
  .login-card:before{
    content:'';
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:46px;height:8px;background:var(--line);border-radius:4px;opacity:.6;
  }
  .badge-emblem{
    width:72px;height:72px;margin:8px auto 6px;
    display:flex;align-items:center;justify-content:center;
  }
  .badge-emblem img{width:100%;height:100%;object-fit:contain;}
  .topbar .logo-img{width:40px;height:40px;object-fit:contain;flex-shrink:0;}
  .topbar .title-row{display:flex;align-items:center;gap:10px;}
  .login-card h1{font-size:44px;margin:4px 0 0;color:var(--ink);}
  .login-card .sub{color:var(--ink-soft);font-size:14px;margin:2px 0 24px;}
  .field-label{
    text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin-bottom:6px;font-weight:600;
  }
  input[type=email],input[type=text],input[type=number]{
    width:100%;padding:12px 14px;
    border:2px dashed var(--line);
    background:var(--paper-2);
    border-radius:3px;
    font-family:'Space Mono',monospace;
    font-size:15px;color:var(--ink);
    margin-bottom:18px;
  }
  input:focus{outline:3px solid var(--gold);outline-offset:1px;border-style:solid;}
  .btn-stamp{
    background:var(--stamp);color:var(--white);border:none;
    padding:13px 22px;border-radius:3px;
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;
    width:100%;
    box-shadow:3px 3px 0 var(--stamp-dark);
    transition:transform .08s ease;
  }
  .btn-stamp:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stamp-dark);}
  .btn-ghost{
    background:transparent;border:2px solid var(--ink);color:var(--ink);
    padding:9px 16px;border-radius:3px;font-weight:600;font-size:13px;
  }
  .error-text{color:var(--stamp-dark);font-size:13px;margin:-8px 0 14px;text-align:left;}

  /* ---------- Header / tabs ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{font-size:34px;margin:0;}
  .who{font-size:12px;color:var(--ink-soft);}
  .who b{color:var(--ink);}
  .logout{background:none;border:none;color:var(--sage);text-decoration:underline;font-size:12px;padding:0;}

  .tabs{
    display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:20px;
    overflow-x:auto;
  }
  .tab{
    padding:9px 16px;background:var(--paper-2);
    border:2px solid var(--ink);border-bottom:none;
    border-radius:6px 6px 0 0;
    font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.04em;
    color:var(--ink-soft); position:relative; top:2px; white-space:nowrap;
  }
  .tab.active{background:var(--white);color:var(--ink);top:0;}

  .panel{background:var(--white);border:2px solid var(--ink);border-radius:0 6px 6px 6px;padding:20px;}

  /* ---------- Progress ---------- */
  .progress-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .progress-track{flex:1;height:14px;background:var(--paper-2);border:2px solid var(--ink);border-radius:8px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--sage);}
  .progress-label{font-family:'Space Mono',monospace;font-size:13px;white-space:nowrap;}

  /* ---------- Album grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(56px,1fr));
    gap:8px;
  }
  .slot{
    position:relative;
    aspect-ratio:3/4;
    border:2px dashed var(--line);
    border-radius:4px;
    background:var(--slot-empty);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:13px;
    color:var(--ink-soft);
    transition:transform .12s ease;
  }
  .slot:hover{transform:translateY(-2px);}
  .slot.have{
    border-style:solid;border-color:var(--stamp);
    background:#EFE3D9;color:var(--ink);
  }
  .slot.have .stampmark{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .slot.have .stampmark svg{
    width:70%;opacity:.9;
    animation:stampdown .22s ease-out;
  }
  @keyframes stampdown{
    0%{transform:scale(1.8) rotate(-18deg);opacity:0;}
    60%{transform:scale(0.92) rotate(-13deg);opacity:1;}
    100%{transform:scale(1) rotate(-14deg);opacity:.9;}
  }
  @media (prefers-reduced-motion: reduce){
    .slot.have .stampmark svg{animation:none;}
  }
  .slot .num{position:absolute;bottom:3px;right:5px;font-size:10px;color:var(--ink-soft);}
  .slot.have .num{color:var(--stamp-dark);}
  .dupe-badge{
    position:absolute;top:-8px;right:-8px;
    background:var(--gold);color:var(--white);
    border-radius:50%;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;border:2px solid var(--white);
    box-shadow:1px 1px 0 var(--gold-dark);
  }
  .legend{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:14px;height:14px;border-radius:3px;display:inline-block;}

  /* ---------- Repetidas ---------- */
  .rep-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 4px;border-bottom:1px solid var(--paper-2);
  }
  .rep-row:last-child{border-bottom:none;}
  .rep-num{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;width:60px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);
    background:var(--paper-2);font-size:16px;font-weight:700;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:default;}
  .stepper .count{font-family:'Space Mono',monospace;min-width:20px;text-align:center;font-weight:700;}
  .empty-msg{color:var(--ink-soft);text-align:center;padding:30px 10px;font-size:14px;}

  /* ---------- Intercambios ---------- */
  .trade-section h3{font-size:20px;margin:0 0 4px;color:var(--sage);}
  .trade-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .member-card{
    border:2px solid var(--ink);border-radius:5px;padding:12px 14px;margin-bottom:12px;
    background:var(--paper-2);
  }
  .member-card .name{font-weight:700;font-size:14px;margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
    background:var(--white);border:1px solid var(--ink);border-radius:3px;
    padding:3px 7px;
  }

  /* ---------- Ajustes ---------- */
  .settings-row{margin-bottom:20px;}
  .settings-row label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .stat-line{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--white);padding:10px 18px;border-radius:5px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}

  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

let state = {
  screen: 'loading', // loading | setup | app
  cards: {},         // { "12": {have:true, extra:2} }
  total: null,
  activeTab: 'album',
};

const root = document.getElementById('app');
const _urlUser = new URLSearchParams(location.search).get('user');
const STORAGE_KEY = _urlUser ? 'crbv-album-v1-' + _urlUser : 'crbv-album-v1';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({cards: state.cards, total: state.total}));
    return true;
  }catch(e){ showToast('No se pudo guardar en este dispositivo.'); return false; }
}

// ---------------- Rendering ----------------

function render(){
  if(state.screen === 'app') return renderApp();
}

function tabClass(t){ return state.activeTab === t ? 'active' : ''; }

function countHave(){
  return Object.values(state.cards).filter(c=>c.have).length;
}

function renderApp(){
  const have = countHave();
  const total = state.total;
  const pct = Math.round((have/total)*100);

  root.innerHTML = `
    <div class="topbar">
      <div class="title-row"><img class="logo-img" src="${LOGO_SRC}" alt="Escudo CRBV"/><h1>FIGURITAS CRBV</h1></div>
      <div class="who">
        Álbum de este dispositivo
        <br/><button class="logout" id="reset-btn">Empezar de nuevo</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${tabClass('album')}" data-tab="album">Mi Álbum</div>
      <div class="tab ${tabClass('rep')}" data-tab="rep">Repetidas</div>
      <div class="tab ${tabClass('settings')}" data-tab="settings">Ajustes</div>
    </div>
    <div class="panel" id="panel"></div>
  `;
  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(!confirm('Esto borra tu álbum de este dispositivo. ¿Seguro?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = {screen:'app', cards:{}, total:TOTAL_FIGURITAS, activeTab:'album'};
    saveLocal();
    render();
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      state.activeTab = t.dataset.tab;
      render();
    });
  });

  const panel = document.getElementById('panel');
  if(state.activeTab === 'album') panel.innerHTML = albumHTML(have, total, pct);
  if(state.activeTab === 'rep') panel.innerHTML = repHTML();
  if(state.activeTab === 'settings') panel.innerHTML = settingsHTML();

  attachPanelEvents();
}

function albumHTML(have, total, pct){
  let cells = '';
  for(let i=1;i<=total;i++){
    const c = state.cards[i];
    const has = c && c.have;
    const extra = c && c.extra ? c.extra : 0;
    cells += `
      <div class="slot ${has?'have':''}" data-num="${i}">
        ${has ? `<div class="stampmark">${STAMP_SVG}</div>` : ''}
        ${extra>0 ? `<div class="dupe-badge">x${extra}</div>` : ''}
        <div class="num">${i}</div>
      </div>
    `;
  }
  return `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${have}/${total}</div>
    </div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--slot-empty);border:1px dashed var(--line)"></span>Te falta</span>
      <span><span class="swatch" style="background:#EFE3D9;border:1px solid var(--stamp)"></span>La tenés</span>
      <span><span class="swatch" style="background:var(--gold)"></span>Repetida</span>
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:14px;">Tocá una figurita para marcarla como conseguida. Para cargar repetidas, andá a la pestaña "Repetidas".</p>
  `;
}

function repHTML(){
  const nums = Object.keys(state.cards)
    .filter(n => state.cards[n].have)
    .sort((a,b)=>parseInt(a)-parseInt(b));
  if(nums.length === 0){
    return `<div class="empty-msg">Todavía no marcaste ninguna figurita como conseguida.<br/>Andá a "Mi Álbum" para empezar.</div>`;
  }
  let rows = nums.map(n=>{
    const extra = state.cards[n].extra || 0;
    return `
      <div class="rep-row" data-num="${n}">
        <div class="rep-num">#${n}</div>
        <div class="stepper">
          <button class="dec" ${extra<=0?'disabled':''}>−</button>
          <div class="count">${extra}</div>
          <button class="inc">+</button>
        </div>
      </div>
    `;
  }).join('');
  return `
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">Marcá cuántas copias de más tenés de cada figurita que ya conseguiste. Esto queda guardado solo en tu álbum.</p>
    ${rows}
  `;
}

function settingsHTML(){
  return `
    <div class="settings-row">
      <label>Total de figuritas del álbum</label>
      <input type="number" value="285" disabled />
      <p class="stat-line">El álbum siempre es de 285 figuritas.</p>
    </div>
  `;
}

function attachPanelEvents(){
  if(state.activeTab === 'album'){
    document.querySelectorAll('.slot').forEach(el=>{
      el.addEventListener('click', ()=> toggleHave(el.dataset.num));
    });
  }
  if(state.activeTab === 'rep'){
    document.querySelectorAll('.rep-row').forEach(row=>{
      const n = row.dataset.num;
      row.querySelector('.inc').addEventListener('click', ()=> changeExtra(n, 1));
      const dec = row.querySelector('.dec');
      if(dec) dec.addEventListener('click', ()=> changeExtra(n, -1));
    });
  }
}

function toggleHave(numStr){
  const n = numStr;
  const cur = state.cards[n];
  if(cur && cur.have){
    delete state.cards[n];
  } else {
    state.cards[n] = {have:true, extra:0};
  }
  render();
  saveLocal();
}

function changeExtra(numStr, delta){
  const cur = state.cards[numStr];
  if(!cur) return;
  const next = Math.max(0, (cur.extra||0) + delta);
  cur.extra = next;
  render();
  saveLocal();
}

// ---------------- Init ----------------
const TOTAL_FIGURITAS = 285;
const saved = loadLocal();
state.total = TOTAL_FIGURITAS;
state.cards = (saved && saved.cards) || {};
state.screen = 'app';
render();
</script>
